spring:
  datasource:
    url: jdbc:h2:mem:scrapestudio-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

scrapestudio:
  demo:
    enabled: false
  worker:
    base-url: http://localhost:8787
    token: test-worker-token
    connect-timeout-ms: 500
    read-timeout-ms: 2000
  jwt:
    secret: test-only-secret-key-that-is-long-enough-for-hs256
    expiration-hours: 1

logging:
  level:
    org.hibernate.SQL: WARN
