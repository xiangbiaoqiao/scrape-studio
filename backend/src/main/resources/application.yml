spring:
  application:
    name: scrape-studio-api
  datasource:
    url: jdbc:h2:file:./data/scrapestudio;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  error:
    include-message: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

scrapestudio:
  worker:
    base-url: ${WORKER_URL:http://localhost:8787}
    token: ${WORKER_TOKEN:dev-worker-token}
    connect-timeout-ms: 5000
    read-timeout-ms: 90000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-please-32-chars-minimum}
    expiration-hours: ${JWT_EXPIRATION_HOURS:168}

logging:
  level:
    com.scrapestudio: INFO
    org.springframework.security: WARN
